# Template only — no real secrets here. This file is packaged into the WAR.
# Put real credentials in application-local.properties at the project root
# (git-ignored, never packaged) or in environment variables DB_URL/DB_USER/DB_PASSWORD.
db.url=jdbc:sqlserver://localhost:1433;databaseName=PetCare;encrypt=true;trustServerCertificate=false
db.username=CHANGE_ME
db.password=CHANGE_ME
db.trustStore=
db.trustStorePassword=

# Gmail SMTP. Use a Google App Password, never the real account password.
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.username=CHANGE_ME
mail.smtp.password=CHANGE_ME
mail.smtp.from=CHANGE_ME

# Cloudinary media upload (format: cloudinary://api_key:api_secret@cloud_name)
# Put real credentials in application-local.properties (git-ignored) or env var CLOUDINARY_URL.
cloudinary.url=CHANGE_ME
cloudinary.cloudName=
cloudinary.apiKey=
cloudinary.apiSecret=
